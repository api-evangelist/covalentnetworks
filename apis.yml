aid: covalentnetworks
name: Covalent
description: >-
  Covalent (Covalent Networks) is a workforce operations software company for
  industrial manufacturing teams in the aerospace & defense and automotive
  sectors, with Fortune 500 manufacturing clients including Boeing. Its platform
  connects workforce skills, task execution and production data to digitize
  on-the-job training, capability and skills management, intelligent work
  allocation, workforce scheduling, and workflow automation with audit reporting,
  replacing paper-based shop-floor processes. Covalent exposes a GraphQL API and
  bidirectional integrations to move workforce, skills and production data across
  enterprise systems such as Workday, SAP, Oracle, UKG, Microsoft, and LMS/ERP/MES
  platforms. API access is authenticated with AWS Cognito (OAuth2/OIDC with MFA)
  and provisioned per tenant. The company is headquartered in Boston, MA and is
  backed by Felicis.
